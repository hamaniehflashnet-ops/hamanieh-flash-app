name: Build APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create --platforms=android --org net.hamaniehflash .

      - name: Forcer une version Android récente (compileSdk/targetSdk)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$f"
              sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' "$f"
              sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$f"
              sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' "$f"
            fi
          done

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hamanieh-flash-test-apk
          path: build/app/outputs/apk/release/app-release.apk
