name: Build APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create --platforms=android --org net.hamaniehflash .

      - name: Ajouter la permission Internet (nécessaire en mode release)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"
          echo "--------------------------------"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "✅ Permission INTERNET bien présente dans le manifeste."
          else
            echo "❌ ERREUR : la permission INTERNET est absente !"
            exit 1
          fi

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hamanieh-flash-test-apk
          path: build/app/outputs/apk/release/app-release.apk
