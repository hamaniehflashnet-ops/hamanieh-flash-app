name: Build APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create --platforms=android --org net.hamaniehflash .

      - name: Configurer les permissions et la sécurité Android
        run: python3 .github/scripts/patch_manifest.py

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hamanieh-flash-test-apk
          path: build/app/outputs/apk/release/app-release.apk
