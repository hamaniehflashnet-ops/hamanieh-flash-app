name: Build APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create --platforms=android --org net.hamaniehflash .

      - name: Configurer les permissions Android (Internet + lecture audio en arrière-plan)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # Permissions nécessaires (Internet + lecture audio en arrière-plan)
          sed -i '/<manifest /a\
    <uses-permission android:name="android.permission.INTERNET" />\
    <uses-permission android:name="android.permission.WAKE_LOCK" />\
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' "$MANIFEST"

          # Service + récepteur requis par just_audio_background pour la notification
          sed -i '/<\/application>/i\
        <service android:name="com.ryanheise.audioservice.AudioService"\
            android:foregroundServiceType="mediaPlayback"\
            android:exported="true">\
            <intent-filter>\
                <action android:name="android.media.browse.MediaBrowserService" />\
            </intent-filter>\
        </service>\
        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"\
            android:exported="true">\
            <intent-filter>\
                <action android:name="android.intent.action.MEDIA_BUTTON" />\
            </intent-filter>\
        </receiver>' "$MANIFEST"

          # Réglages de sécurité de base
          sed -i 's/android:label="hamanieh_flash"/android:label="hamanieh_flash"\n        android:allowBackup="false"\n        android:usesCleartextTraffic="false"/' "$MANIFEST"

          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"
          echo "--------------------------------"
          if grep -q "android.permission.INTERNET" "$MANIFEST" && grep -q "AudioService" "$MANIFEST"; then
            echo "✅ Manifeste correctement configuré (Internet + audio en arrière-plan)."
          else
            echo "❌ ERREUR : la configuration du manifeste a échoué !"
            exit 1
          fi

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hamanieh-flash-test-apk
          path: build/app/outputs/apk/release/app-release.apk
